<text text-anchor="start" x="1027" y="-77" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;</text>
<text text-anchor="start" x="1040" y="-77" font-family="DejaVu Sans" font-weight="bold" font-size="10.00">Gargalos e riscos</text>
<text text-anchor="start" x="1027" y="-67" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;1. Processamento dentro da requisição: conexão presa durante toda a geração</text>
<text text-anchor="start" x="1027" y="-57" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;2. Sem fila nem limite de concorrência: N pedidos = N threads disputando a GPU</text>
<text text-anchor="start" x="1027" y="-47" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;3. Nada persiste: queda/restart perde todos os pedidos; sem progresso nem cancelamento</text>
<text text-anchor="start" x="1027" y="-37" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;4. Arquivos de nome fixo: pedidos simultâneos sobrescrevem entrada/saída</text>
<text text-anchor="start" x="1027" y="-27" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;5. Servidor de desenvolvimento com debug=True (console Werkzeug) e IP fixo</text>
<text text-anchor="start" x="1027" y="-17" font-family="DejaVu Sans" font-size="10.00"> &#160;&#160;&#160;6. Sem validação de imagem, limites, autenticação, TLS, métricas ou logs estruturados</text>
<text text-anchor="start" x="1250.5" y="-7" font-family="DejaVu Sans" font-size="10.00"> &#160;</text>
</g>
